name: outreach
on:
  schedule:
    - cron: '5 14 * * 1-5'   # weekdays ~10:05 AM ET
  workflow_dispatch:
    inputs:
      cap:
        description: 'Max emails today (blank = ramp schedule)'
        default: ''
permissions:
  contents: write
concurrency: outreach
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: outreach
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pynacl
      - name: Daily cap (ramp 90 -> 120 -> 150, approved by FRAMEXGOD 2026-10-11)
        env:
          CAP_INPUT: ${{ inputs.cap }}
        run: |
          if [ -n "$CAP_INPUT" ]; then cap="$CAP_INPUT"
          else
            d=$(TZ=America/New_York date +%F)
            if   [ "$d" \< "2026-10-15" ]; then cap=90
            elif [ "$d" \< "2026-10-20" ]; then cap=120
            else cap=150; fi
          fi
          echo "DAILY_CAP=$cap" >> "$GITHUB_ENV"
          echo "cap today: $cap"
      - name: Send
        env:
          OUTREACH_SK: ${{ secrets.OUTREACH_SK }}
          RESEND_KEY: ${{ secrets.RESEND_KEY }}
        run: python daily.py
      - name: Save state
        if: always()
        run: |
          git config user.name "framexgod-outreach"
          git config user.email "info@framexgod.com"
          git add -A
          git commit -m "outreach $(date -u +%F)" || true
          git push origin outreach
