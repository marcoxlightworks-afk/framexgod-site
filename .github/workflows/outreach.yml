name: outreach
on:
  schedule:
    - cron: '5 14 * * 1-5'   # weekdays ~10:05 AM ET
  workflow_dispatch:
    inputs:
      cap:
        description: 'Max emails today'
        default: '90'
permissions:
  contents: write
concurrency: outreach
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: outreach
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q pynacl
      - name: Send
        env:
          OUTREACH_SK: ${{ secrets.OUTREACH_SK }}
          DAILY_CAP: ${{ inputs.cap || '90' }}
        run: python daily.py
      - name: Save state
        if: always()
        run: |
          git config user.name "framexgod-outreach"
          git config user.email "info@framexgod.com"
          git add -A data.sealed status.json inbox
          git commit -m "outreach $(date -u +%F)" || true
          git push origin outreach
